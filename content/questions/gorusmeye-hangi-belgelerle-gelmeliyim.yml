question: Görüşmeye hangi belgelerle gelmeliyim?
summary: Konuya ilişkin sözleşme, tebligat, dava dosyası ve yazışmaların örnekleri ilk görüşmede yararlı olur.
date: 2026-09-24
tags:
  - randevu
  - belgeler
contact: true
answer: |
  İlk görüşmede, uyuşmazlığın veya talebin dayandığı belgelerin bulunması değerlendirmenin
  sağlıklı yapılabilmesi bakımından önemlidir. Belgelerin asıllarını getirmeniz gerekmez;
  okunaklı fotokopileri veya dijital kopyaları yeterlidir.

  Konuya göre değişmekle birlikte genellikle şu belgeler istenir:

  - Kimlik belgesi
  - Varsa sözleşme, protokol ve ekleri
  - Tebligatlar, ihtarnameler ve bunların zarfları
  - Devam eden bir dosya varsa dava veya icra dosyası numarası
  - Konuya ilişkin yazışmalar, e-postalar, mesajlar ve ödeme belgeleri

  Belgelerin tamamına ulaşamamış olmanız görüşmeye engel değildir; eksik belgeler görüşme
  sonrasında da tamamlanabilir. Tebligat aldıysanız, sürelerin işlemeye başladığını dikkate
  alarak *zaman kaybetmeden* başvurmanız önerilir.
en:
  question: Which documents should I bring to a meeting?
  summary: Copies of the contracts, notices, case files and correspondence behind the matter help at a first meeting.
  answer: |
    Having the documents the matter rests on available at the first meeting makes a sound
    assessment possible. Originals are not needed; legible photocopies or digital copies are enough.

    What is usually asked for, depending on the matter:

    - An identity document
    - Contracts, protocols and their annexes, where they exist
    - Service of process, formal notices and their envelopes
    - The file number of any pending court or enforcement proceedings
    - Correspondence, e-mails, messages and payment records about the matter

    Not having every document is no obstacle to the meeting; anything missing can follow later. If
    you have received a formal notice, time limits may already be running, so applying *without
    delay* is advisable.
