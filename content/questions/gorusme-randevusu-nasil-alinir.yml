question: Görüşme randevusu nasıl alınır?
summary: Randevu talepleri telefon, WhatsApp veya e-posta ile iletilir; görüşmeler önceden belirlenen saatte yapılır.
date: 2026-09-24
tags:
  - randevu
  - iletişim
answer: |
  Büro ile görüşme talepleriniz telefon, WhatsApp veya e-posta yoluyla iletilebilir. Talebinizi
  iletirken konunun hangi hukuk alanına ilişkin olduğunu kısaca belirtmeniz, görüşmenin daha
  verimli geçmesini sağlar.

  Görüşmeler *randevu ile* yapılmaktadır. Randevu saatinin belirlenmesinde duruşma ve keşif
  programları gözetildiğinden, talebinizi mümkün olduğunca önceden iletmeniz beklenir.

  - Telefon ve WhatsApp: mesai saatleri içinde
  - E-posta: her zaman; yanıt mesai saatleri içinde verilir
  - Görüşme yeri: büronun Gölbaşı / Ankara adresi

  Randevu talebinizde iletişim bilgilerinizi eksiksiz paylaşmanız, saat değişikliği gerektiğinde
  size ulaşılabilmesi bakımından önemlidir.
en:
  question: How is a meeting arranged?
  summary: Meeting requests reach the office by phone, WhatsApp or e-mail, and meetings take place at an agreed time.
  answer: |
    Requests for a meeting can be sent by phone, WhatsApp or e-mail. Briefly stating which area of
    law the matter concerns helps the office prepare for the meeting.

    Meetings are held *by appointment*. Because hearing and site-visit schedules are taken into
    account when a time is set, requests should be sent as early as possible.

    - Phone and WhatsApp: during office hours
    - E-mail: at any time, answered during office hours
    - Where: the office address in Gölbaşı, Ankara

    Please include complete contact details, so the office can reach you if the time has to change.
