question: Vekaletname nasıl çıkarılır?
summary: Vekaletname noterde düzenlenir; bazı işlerde özel yetki ve fotoğraflı vekaletname aranır.
date: 2026-09-24
tags:
  - vekaletname
  - süreç
answer: |
  Avukatın sizi temsil edebilmesi için noterde düzenlenen bir vekaletname gerekir. Vekaletname,
  kimliğinizle birlikte herhangi bir noterliğe başvurarak çıkarılır; büro, çıkarılacak
  vekaletnamenin türünü ve içermesi gereken yetkileri önceden bildirir.

  Uygulamada dikkat edilen noktalar şunlardır:

  - Boşanma davaları ile bazı işlerde *fotoğraflı* vekaletname aranır.
  - Kabul, feragat, sulh, satış gibi işlemler için vekaletnamede özel yetkilerin ayrıca
    belirtilmesi gerekir.
  - Şirket adına verilecek vekaletnamelerde imza yetkisinin sicil kayıtlarıyla uyumlu olması aranır.
  - Yurt dışındaysanız vekaletname, Türkiye Cumhuriyeti konsolosluklarından düzenlenebilir.

  Vekaletnamenin düzenlenmiş olması tek başına vekâlet ilişkisinin kurulduğu anlamına gelmez;
  büronun işi üstlenmesi ayrıca değerlendirilir.
en:
  question: How is a power of attorney issued?
  summary: A power of attorney is drawn up before a notary; some matters require special authority and a photograph.
  answer: |
    A power of attorney drawn up before a notary is needed before an attorney can represent you. It
    is issued by applying to any notary with your identity document; the office states in advance
    which type is needed and which powers it has to contain.

    Points that matter in practice:

    - Divorce cases and certain other matters require a power of attorney *with a photograph*.
    - Acts such as acceptance, waiver, settlement or sale have to be listed as special authorities.
    - For a company, signing authority has to match the trade registry records.
    - From abroad, a power of attorney can be issued by a Turkish consulate.

    A power of attorney on its own does not mean the office has taken on the matter; that is a
    separate decision.
